<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vince AI</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #05070d;
    --glass: rgba(255,255,255,.08);
    --glass-strong: rgba(255,255,255,.13);
    --stroke: rgba(255,255,255,.18);
    --text: rgba(255,255,255,.96);
    --muted: rgba(255,255,255,.55);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070d;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "SF Pro Text", Inter, system-ui, sans-serif;
    color: var(--text);
  }

  body {
    position: relative;
  }

  /* ---------- BACKGROUND ---------- */

  .background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 0%, rgba(80,90,140,.18), transparent 42%),
      linear-gradient(180deg, #111722 0%, #090d15 48%, #030406 100%);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .65;
    animation: floatBlob 10s ease-in-out infinite alternate;
  }

  .blob.one {
    width: 340px;
    height: 340px;
    background: #7c4dff;
    top: -120px;
    left: -100px;
  }

  .blob.two {
    width: 300px;
    height: 300px;
    background: #00bfff;
    top: 22%;
    right: -120px;
    animation-delay: -3s;
  }

  .blob.three {
    width: 320px;
    height: 320px;
    background: #ff4ca0;
    bottom: -130px;
    left: 20%;
    animation-delay: -6s;
  }

  @keyframes floatBlob {
    from {
      transform: translate3d(-10px,-10px,0) scale(1);
    }
    to {
      transform: translate3d(25px,30px,0) scale(1.12);
    }
  }

  /* ---------- APP ---------- */

  .app {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding:
      max(env(safe-area-inset-top), 22px)
      20px
      max(env(safe-area-inset-bottom), 22px);
  }

  /* ---------- TOP BAR ---------- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 54px;
  }

  .title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .mini-orb {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, #fff 0%, rgba(255,255,255,.75) 5%, transparent 20%),
      conic-gradient(
        from 180deg,
        #6c63ff,
        #35c7ff,
        #30ffba,
        #ffea5e,
        #ff689b,
        #a54dff,
        #6c63ff
      );
    box-shadow:
      0 0 20px rgba(93, 140, 255, .5),
      inset 0 0 18px rgba(255,255,255,.45);
  }

  .title {
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -.3px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .icon-button {
    width: 42px;
    height: 42px;
    border: 1px solid var(--stroke);
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    border-radius: 50%;
    color: white;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform .2s ease, background .2s ease;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      0 8px 30px rgba(0,0,0,.18);
  }

  .icon-button:active {
    transform: scale(.92);
    background: rgba(255,255,255,.15);
  }

  /* ---------- MAIN ---------- */

  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    min-height: 0;
  }

  .assistant-wrap {
    width: min(410px, 90vw);
    text-align: center;
  }

  .orb-area {
    height: 260px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .orb-glow {
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background:
      conic-gradient(
        #7c4dff,
        #35d4ff,
        #4ef9c0,
        #ffe45e,
        #ff5f97,
        #9c5cff,
        #7c4dff
      );
    filter: blur(36px);
    opacity: .55;
    animation: rotateGlow 7s linear infinite;
  }

  @keyframes rotateGlow {
    to { transform: rotate(360deg); }
  }

  .orb {
    position: relative;
    width: 154px;
    height: 154px;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;

    background:
      radial-gradient(circle at 31% 20%,
        rgba(255,255,255,.9) 0%,
        rgba(255,255,255,.3) 7%,
        transparent 25%),

      radial-gradient(circle at 70% 78%,
        rgba(0,180,255,.75),
        transparent 40%),

      radial-gradient(circle at 18% 70%,
        rgba(255,70,170,.7),
        transparent 42%),

      conic-gradient(
        from 40deg,
        #642cff,
        #19b7ff,
        #43ffd0,
        #ffe273,
        #ff5ca8,
        #8d43ff,
        #642cff
      );

    border: 1px solid rgba(255,255,255,.35);

    box-shadow:
      0 0 70px rgba(80,120,255,.28),
      inset 0 0 35px rgba(255,255,255,.3),
      inset 0 -20px 35px rgba(0,0,0,.17);

    animation:
      orbFloat 4s ease-in-out infinite,
      orbHue 10s linear infinite;
  }

  .orb::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: inherit;

    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,.42),
        rgba(255,255,255,.04) 32%,
        rgba(255,255,255,.12) 70%,
        rgba(255,255,255,.3)
      );

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .orb::after {
    content: "";
    position: absolute;
    inset: -25%;
    border-radius: 50%;
    background:
      radial-gradient(circle,
        rgba(255,255,255,.38),
        transparent 48%);
    transform: translate(-18%, -20%);
  }

  @keyframes orbFloat {
    0%, 100% {
      transform: translateY(0) scale(1);
    }
    50% {
      transform: translateY(-9px) scale(1.025);
    }
  }

  @keyframes orbHue {
    to {
      filter: hue-rotate(360deg);
    }
  }

  .orb.listening {
    animation:
      listeningPulse 1.1s ease-in-out infinite,
      orbHue 5s linear infinite;
  }

  .orb.listening + .orb-glow {
    opacity: .9;
  }

  @keyframes listeningPulse {
    0%,100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.1);
    }
  }

  /* ---------- TEXT ---------- */

  .headline {
    font-size: clamp(29px, 6vw, 38px);
    font-weight: 660;
    letter-spacing: -1.3px;
    margin-top: 5px;
  }

  .response {
    max-width: 340px;
    margin: 13px auto 0;
    min-height: 48px;
    font-size: 17px;
    line-height: 1.45;
    color: rgba(255,255,255,.72);
  }

  /* ---------- CHIPS ---------- */

  .suggestions {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .chip {
    border: 1px solid rgba(255,255,255,.15);
    color: rgba(255,255,255,.88);
    background: rgba(255,255,255,.07);

    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);

    padding: 11px 15px;
    border-radius: 999px;
    font-size: 14px;

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      0 8px 30px rgba(0,0,0,.15);

    cursor: pointer;
    transition: all .2s ease;
  }

  .chip:active {
    transform: scale(.95);
    background: rgba(255,255,255,.13);
  }

  /* ---------- BOTTOM INPUT ---------- */

  .bottom {
    width: min(680px, 100%);
    margin: 0 auto;
  }

  .input-shell {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 7px 8px 7px 17px;
    min-height: 58px;

    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.18);

    background:
      linear-gradient(
        135deg,
        rgba(255,255,255,.12),
        rgba(255,255,255,.055)
      );

    backdrop-filter: blur(35px) saturate(180%);
    -webkit-backdrop-filter: blur(35px) saturate(180%);

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.2),
      0 14px 50px rgba(0,0,0,.28);
  }

  input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
    font-family: inherit;
  }

  input::placeholder {
    color: rgba(255,255,255,.42);
  }

  .send {
    width: 44px;
    height: 44px;
    flex: 0 0 44px;

    border-radius: 50%;
    border: 0;

    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,.92),
        rgba(220,225,255,.75)
      );

    color: #10131a;
    cursor: pointer;

    font-size: 19px;
    font-weight: bold;

    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.8),
      0 5px 18px rgba(0,0,0,.25);

    transition: transform .2s ease;
  }

  .send:active {
    transform: scale(.9);
  }

  /* ---------- LIQUID BORDER ---------- */

  .liquid-border {
    pointer-events: none;
    position: fixed;
    inset: 4px;
    border-radius: 28px;
    z-index: 20;

    padding: 2px;

    background:
      conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(100,74,255,.9) 45deg,
        rgba(45,210,255,.9) 105deg,
        rgba(65,255,190,.85) 160deg,
        rgba(255,220,70,.85) 220deg,
        rgba(255,77,160,.9) 285deg,
        rgba(120,74,255,.95) 350deg,
        transparent 360deg
      );

    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;

    opacity: .45;
    filter: blur(.4px);
    animation: borderRotate 8s linear infinite;
  }

  @keyframes borderRotate {
    to {
      filter: hue-rotate(360deg);
    }
  }

  /* ---------- THINKING ---------- */

  .thinking {
    display: inline-flex;
    gap: 5px;
    align-items: center;
    height: 20px;
  }

  .thinking span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: white;
    opacity: .4;
    animation: dots 1s infinite alternate;
  }

  .thinking span:nth-child(2) {
    animation-delay: .2s;
  }

  .thinking span:nth-child(3) {
    animation-delay: .4s;
  }

  @keyframes dots {
    to {
      transform: translateY(-6px);
      opacity: 1;
    }
  }

  /* ---------- MOBILE ---------- */

  @media (max-height: 700px) {
    .orb-area {
      height: 200px;
    }

    .orb {
      width: 120px;
      height: 120px;
    }

    .orb-glow {
      width: 150px;
      height: 150px;
    }

    .headline {
      font-size: 28px;
    }

    .suggestions {
      margin-top: 17px;
    }
  }
</style>
</head>

<body>

<div class="background">
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>
</div>

<div class="liquid-border"></div>

<div class="app">

  <div class="topbar">

    <div class="title-group">
      <div class="mini-orb"></div>

      <div>
        <div class="title">Vince</div>
        <div class="subtitle">Assistant personnel</div>
      </div>
    </div>

    <button class="icon-button" onclick="resetVince()" aria-label="Nouvelle conversation">
      ✦
    </button>

  </div>

  <main class="main">

    <div class="assistant-wrap">

      <div class="orb-area">

        <div class="orb-glow"></div>

        <div
          class="orb"
          id="orb"
          onclick="toggleListening()"
        ></div>

      </div>

      <h1 class="headline" id="headline">
        Bonjour.
      </h1>

      <div class="response" id="response">
        Qu’est-ce que je peux faire pour toi ?
      </div>

      <div class="suggestions">

        <button
          class="chip"
          onclick="askSuggestion('Que puis-je faire avec toi ?')"
        >
          Que peux-tu faire ?
        </button>

        <button
          class="chip"
          onclick="askSuggestion('Donne-moi une idée créative')"
        >
          Inspire-moi
        </button>

        <button
          class="chip"
          onclick="askSuggestion('Organise ma journée')"
        >
          Ma journée
        </button>

      </div>

    </div>

  </main>

  <div class="bottom">

    <div class="input-shell">

      <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="Demander à Vince…"
      />

      <button
        class="send"
        onclick="sendMessage()"
        aria-label="Envoyer"
      >
        ↑
      </button>

    </div>

  </div>

</div>

<script>

const input = document.getElementById("input");
const response = document.getElementById("response");
const headline = document.getElementById("headline");
const orb = document.getElementById("orb");

let listening = false;


/* ---------- SEND ---------- */

input.addEventListener("keydown", (event) => {

  if (event.key === "Enter") {
    sendMessage();
  }

});


function sendMessage() {

  const message = input.value.trim();

  if (!message) return;

  input.value = "";

  headline.textContent = "Vince";

  response.innerHTML = `
    <div class="thinking">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  orb.classList.add("listening");

  setTimeout(() => {

    orb.classList.remove("listening");

    response.textContent = createAnswer(message);

  }, 900);

}


/* ---------- DEMO AI ---------- */

function createAnswer(message) {

  const text = message.toLowerCase();

  if (
    text.includes("bonjour") ||
    text.includes("salut")
  ) {
    return "Salut 👋 Je suis Vince. Que veux-tu faire ?";
  }

  if (
    text.includes("heure")
  ) {
    return "Il est " +
      new Date().toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
      }) +
      ".";
  }

  if (
    text.includes("date")
  ) {
    return "Nous sommes le " +
      new Date().toLocaleDateString(
        "fr-FR",
        {
          weekday: "long",
          day: "numeric",
          month: "long"
        }
      ) +
      ".";
  }

  if (
    text.includes("créative") ||
    text.includes("inspire")
  ) {
    return "Et si on construisait une interface futuriste contrôlée uniquement par la voix ?";
  }

  if (
    text.includes("peux-tu faire")
  ) {
    return "Je peux discuter avec toi, lancer des actions, répondre à tes demandes et devenir ton assistant personnel.";
  }

  return "J’ai compris : « " + message + " ». Pour l’instant je suis en mode démo, mais on peut ensuite me connecter à une vraie IA.";

}


/* ---------- SUGGESTIONS ---------- */

function askSuggestion(message) {

  input.value = message;
  sendMessage();

}


/* ---------- VOICE ---------- */

function toggleListening() {

  listening = !listening;

  if (listening) {

    orb.classList.add("listening");

    headline.textContent = "Je t’écoute…";
    response.textContent = "Parle naturellement.";

    startVoiceRecognition();

  } else {

    orb.classList.remove("listening");

    headline.textContent = "Vince";
    response.textContent = "Je suis là.";

  }

}


function startVoiceRecognition() {

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {

    response.textContent =
      "La reconnaissance vocale n’est pas disponible dans ce navigateur.";

    return;
  }

  const recognition = new Recognition();

  recognition.lang = "fr-FR";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.start();

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    input.value = text;

    listening = false;
    orb.classList.remove("listening");

    sendMessage();

  };

  recognition.onerror = function() {

    listening = false;
    orb.classList.remove("listening");

    headline.textContent = "Vince";
    response.textContent =
      "Je n’ai pas bien entendu.";

  };

}


/* ---------- RESET ---------- */

function resetVince() {

  input.value = "";

  headline.textContent = "Bonjour.";

  response.textContent =
    "Qu’est-ce que je peux faire pour toi ?";

  orb.classList.remove("listening");

}

</script>

</body>
</html>
